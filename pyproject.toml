[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "reuse_ready"
version = "0.1.0"
description = "Reuse-Ready: a siting screen and water term sheet for data center community benefit agreements in the Delaware River Basin"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Reuse-Ready authors" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "geopandas",
    "pyogrio",
    "shapely",
    "pyproj",
    "contextily",
    "folium",
    "branca",
    "pyarrow",
    "requests",
    "colorspacious",
    "dataretrieval",
    "xyzservices",
    "pypdfium2",
    "pillow",
    "fonttools",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
